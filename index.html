<!doctype html>
<html lang="es" class="dark overflow-x-clip w-full max-w-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-R.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Roosty Agenda | Software para Barberías & Salones</title>
    <meta name="description" content="Agenda online, gestión de turnos, barberos y clientes en tiempo real." />

    <!-- Default Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Roosty Agenda | Software para Barberías & Salones" />
    <meta property="og:description" content="Agenda online, gestión de turnos, barberos y clientes en tiempo real." />
    <meta property="og:image" content="/icon-R.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Inter, JetBrains Mono, Merriweather, Montserrat, Roboto, Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Montserrat:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600;1,700&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('roosty_theme');
          var theme = saved || 'dark';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased select-none overflow-x-clip w-full max-w-full">
    <div id="root" class="w-full max-w-full overflow-x-clip"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
